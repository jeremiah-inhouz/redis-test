apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: redis-test-ms-gcp-secrets
  namespace: dev
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/inhouz-dev/secrets/redishost/versions/latest"
        fileName: "redishost"
      - resourceName: "projects/inhouz-dev/secrets/redispassword/versions/latest"
        fileName: "redispassword"
